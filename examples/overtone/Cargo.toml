[package]
name = "rsx-overtone"
version = "0.1.0"
edition = "2024"
build = "src/build.rsx"

[features]
ui-tests = ["gpui-kit/test-support"]

[lib]
path = "src/core.rsx"

[[bin]]
name = "overtone"
path = "src/main.rsx"

[dependencies]
gpui-kit = "=0.7.0"
gpui-rsc = { path = "../..", default-features = false, features = ["runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
gpui-rsc = { path = "../..", default-features = false, features = ["compiler"] }
