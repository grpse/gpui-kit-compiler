[package]
name = "rsx-video-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "=0.7.0"
gpui-base = "=0.7.0"
gpui-rsc = { path = "../..", default-features = false, features = ["runtime"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
async-channel = "2"
ffmpeg-next = { version = "9", default-features = false, features = ["format", "filter", "software-scaling", "software-resampling"] }
cpal = "0.18"
rtrb = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[lib]
path = "src/model.rs"
